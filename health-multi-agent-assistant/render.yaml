services:
  - type: web
    name: multilingual-health-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_PATH
        value: /var/data/health_assistant.db
    disk:
      name: health-data
      mountPath: /var/data
      sizeGB: 1
  - type: web
    name: multilingual-health-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: multilingual-health-backend
          property: host
